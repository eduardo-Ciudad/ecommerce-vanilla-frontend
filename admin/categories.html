<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categorias | Painel Admin MiniModa</title>
  <meta name="description" content="Gerencie as categorias de produtos da MiniModa." />
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <button class="admin-menu-toggle" data-admin-menu-toggle aria-label="Abrir menu">☰</button>

    <aside class="admin-sidebar" data-admin-sidebar>
      <div class="admin-sidebar-logo">Mini<span>Moda</span> Admin</div>
      <nav class="admin-nav">
        <a href="index.html">Dashboard</a>
        <a href="categories.html">Categorias</a>
        <a href="products.html">Produtos</a>
        <a href="orders.html">Pedidos</a>
      </nav>
      <div class="admin-sidebar-footer">
        <a href="../index.html">&larr; Voltar à loja</a>
        <button type="button" data-admin-logout>Sair</button>
      </div>
    </aside>

    <main class="admin-content">
      <div class="admin-page-header">
        <h1>Categorias</h1>
        <button class="btn btn-primary" type="button" data-new-category-btn>+ Nova Categoria</button>
      </div>

      <div class="admin-table-wrapper">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Criada em</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody data-categories-tbody>
            <tr><td colspan="3"><div class="skeleton" style="height: 1.5rem"></div></td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin/categories.js"></script>
</body>
</html>
