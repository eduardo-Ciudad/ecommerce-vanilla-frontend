<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produtos | Painel Admin MiniModa</title>
  <meta name="description" content="Gerencie produtos e variações de tamanho, preço e estoque da MiniModa." />
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <button class="admin-menu-toggle" data-admin-menu-toggle aria-label="Abrir menu">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg>
    </button>

    <aside class="admin-sidebar" data-admin-sidebar>
      <div class="admin-sidebar-logo">Mini<span>Moda</span> Admin</div>
      <nav class="admin-nav">
        <a href="index.html">Dashboard</a>
        <a href="categories.html">Categorias</a>
        <a href="products.html">Produtos</a>
        <a href="orders.html">Pedidos</a>
      </nav>
      <div class="admin-sidebar-footer">
        <a href="../index.html">&larr; Voltar à loja</a>
        <button type="button" data-admin-logout>Sair</button>
      </div>
    </aside>

    <main class="admin-content">
      <div class="admin-page-header">
        <h1>Produtos</h1>
        <button class="btn btn-primary" type="button" data-new-product-btn>+ Novo Produto</button>
      </div>

      <div class="admin-table-wrapper">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Imagem</th>
              <th>Nome</th>
              <th>Categoria</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody data-products-tbody>
            <tr><td colspan="5"><div class="skeleton skeleton-row"></div></td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin/products.js"></script>
</body>
</html>
