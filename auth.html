<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar ou Criar Conta | MiniModa</title>
  <meta name="description" content="Entre na sua conta MiniModa ou crie uma conta nova para comprar moda infantil com estilo." />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div id="header-root"></div>

  <main class="auth-page">
    <div class="auth-card fade-in">
      <div class="auth-tabs">
        <button class="auth-tab is-active" data-tab="login" type="button">Entrar</button>
        <button class="auth-tab" data-tab="register" type="button">Criar Conta</button>
      </div>

      <form class="auth-form is-active" data-form="login" novalidate>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input class="form-control" type="email" id="login-email" name="email" required autocomplete="email" />
          <p class="form-error"></p>
        </div>
        <div class="form-group">
          <label for="login-password">Senha</label>
          <input class="form-control" type="password" id="login-password" name="password" required autocomplete="current-password" />
          <p class="form-error"></p>
        </div>
        <button class="btn btn-primary btn-block" type="submit">
          <span class="btn-label">Entrar</span>
        </button>
      </form>

      <form class="auth-form" data-form="register" novalidate>
        <div class="form-group">
          <label for="register-name">Nome</label>
          <input class="form-control" type="text" id="register-name" name="name" required autocomplete="name" />
          <p class="form-error"></p>
        </div>
        <div class="form-group">
          <label for="register-email">Email</label>
          <input class="form-control" type="email" id="register-email" name="email" required autocomplete="email" />
          <p class="form-error"></p>
        </div>
        <div class="form-group">
          <label for="register-password">Senha</label>
          <input class="form-control" type="password" id="register-password" name="password" required autocomplete="new-password" />
          <p class="form-error"></p>
        </div>
        <div class="form-group">
          <label for="register-confirm">Confirmar Senha</label>
          <input class="form-control" type="password" id="register-confirm" name="confirmPassword" required autocomplete="new-password" />
          <p class="form-error"></p>
        </div>
        <button class="btn btn-primary btn-block" type="submit">
          <span class="btn-label">Criar Conta</span>
        </button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-grid">
      <div class="footer-col">
        <h4>Sobre a MiniModa</h4>
        <p>Moda infantil com qualidade e carinho para vestir cada fase da infância com estilo e conforto.</p>
      </div>
      <div class="footer-col">
        <h4>Navegação</h4>
        <a href="index.html">Home</a>
        <a href="shop.html">Loja</a>
        <a href="cart.html">Carrinho</a>
      </div>
      <div class="footer-col">
        <h4>Atendimento</h4>
        <p>contato@minimoda.com.br</p>
        <p>(11) 4000-0000</p>
      </div>
      <div class="footer-col">
        <h4>Redes Sociais</h4>
        <div class="footer-social">
          <a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg></a>
          <a href="#" aria-label="Facebook"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9h3V6h-3a3 3 0 00-3 3v2H8v3h3v6h3v-6h3l1-3h-4V9a1 1 0 011-1z"/></svg></a>
          <a href="#" aria-label="WhatsApp"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.5 8.5 0 01-12.4 7.6L3 20l1-5.5A8.5 8.5 0 1121 11.5z"/></svg></a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">© 2026 MiniModa. Todos os direitos reservados.</div>
  </footer>

  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/header.js"></script>
</body>
</html>
